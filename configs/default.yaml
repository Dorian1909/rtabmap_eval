# RTAB-Map Evaluation Platform — Default Configuration
# Copy to configs/user.yaml and modify to match your environment.

# Note: RTAB-Map must already be built, and ROS2 + colcon workspace must be
# sourced in the shell that invokes this tool. This tool does not build or
# source any environment.

# Path to rtabmap.db. Deleted before each run when --clean is used.
# Override only if your RTAB-Map launch uses a non-default db path.
db_path: ~/.ros/rtabmap.db

# ============================================================
# Dataset and ground truth paths
# ============================================================
paths:
  # Root directory containing bag subfolders
  bag_dir: /home/dpx/merged_bags2
  # Root directory containing ground truth .tum files
  gt_dir: /home/dpx/tum_data2/tum_data
  # User-provided RTAB-Map launch command line. Supports arbitrary launch
  # arguments. Use absolute paths to be safe from any cwd.
  # MUST be overridden in user.yaml — REPLACE_ME is a placeholder that fails
  # validation.
  # Example: "ros2 launch /abs/path/to/your_rtabmap.launch.py localization:=true"
  launch_cmd: REPLACE_ME

# ============================================================
# Bag → Ground truth mapping
# Key = bag folder name under paths.bag_dir
# Value = GT file prefix under paths.gt_dir (prefix_gt.tum)
# ============================================================
bag_mapping:
  bag_20260527_160436: "05271604"
  bag_20260527_163821: "05271638"
  bag_20260527_164108: "05271640"
  bag_20260527_164443: "05271644"
  bag_20260527_164810: "05271647"
  bag_20260527_165435: "05271654"
  bag_20260527_170516: "05271704"
  bag_20260527_171004: "05271709"
  bag_20260527_171537: "05271715"
  bag_20260527_172146: "05271721"
  bag_20260527_172930: "05271729"

# ============================================================
# Evaluation settings
# ============================================================
eval:
  # Number of times to repeat each bag (accounts for non-determinism)
  runs_per_bag: 3
  # Seconds to wait for RTAB-Map nodes to be ready after launch
  startup_wait_s: 10
  # Seconds to wait after bag playback for RTAB-Map to finish processing
  shutdown_wait_s: 5
  # TF recording rate (Hz)
  record_rate_hz: 20
  # Maximum wall-clock seconds per bag playback (safety timeout)
  playback_timeout_s: 600

  # --- Trajectory validity checks (reject degenerate SLAM output) ---
  # Detects failed runs where a broken TF leaves RTAB-Map emitting a useless
  # trajectory (stationary jitter, truncated span) that evo would otherwise
  # still score as a valid result. Any single check failing marks the run failed.
  validity:
    # Reject trajectories with fewer than this many poses.
    min_poses: 10
    # Reject trajectories whose time span covers less than this fraction of the
    # expected duration (bag metadata duration, falling back to GT span).
    # Set to 0.0 to disable the span check.
    min_coverage: 0.5
    # Reject trajectories whose translational extent (max-min of x, y, z) is
    # below this threshold in meters. Catches "robot never moved".
    # Set to 0.0 to disable.
    min_extent_m: 0.05
    # Extra slack (seconds) when comparing trajectory span to expected duration,
    # absorbing startup/shutdown trimming.
    span_tolerance_s: 2.0

# ============================================================
# eval.launch.py configuration (robot-specific)
# These fields are passed as launch arguments to eval.launch.py.
# Override in user.yaml to match your robot.
# ============================================================
eval_launch:
  # Static TF: parent → child (camera_depth_frame is optical convention:
  # X-right, Y-down, Z-forward; base_footprint is robot frame: X-forward,
  # Y-left, Z-up). Set enable_static_tf: false if your robot launch already
  # publishes this TF.
  static_tf:
    x: 0.0
    y: 0.0
    z: 0.0
    roll: -1.5708
    pitch: 0.0
    yaw: -1.544
    parent: base_footprint
    child: camera_depth_frame
  # Auxiliary process toggles. Disable ones your robot doesn't need.
  enable_static_tf: true
  enable_nv12_to_bgr: true
  enable_odom_to_tf: true
  enable_foxglove: true
  enable_rviz: false
  enable_rtabmap_viz: false
  # Delay before starting bag playback (s), lets aux nodes be ready
  bag_start_delay_s: 3.0

# ============================================================
# evo evaluation parameters
# ============================================================
evo:
  # Maximum timestamp difference for trajectory alignment
  t_max_diff: 0.5
  # RPE delta (number of frames between pairs)
  rpe_delta: 1
  # RPE delta unit: f=frames, d=distance, r=rotations, m=minutes
  rpe_delta_unit: f

# ============================================================
# OpenGL / display settings (for headless or WSL2)
# ============================================================
env:
  LIBGL_ALWAYS_SOFTWARE: "1"
  GALLIUM_DRIVER: "llvmpipe"
  MESA_GL_VERSION_OVERRIDE: "3.3"
  MESA_GLSL_VERSION_OVERRIDE: "330"
